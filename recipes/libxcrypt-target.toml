name = "libxcrypt-target"
version = "4.5.2"
source = "https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz"
sha256 = "71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071"
archive_root = "libxcrypt-4.5.2"
build_type = "target"
depends = ["glibc"]

build = [
  "sed -i '/strchr/s/const//' lib/crypt-sm3-yescrypt.c lib/crypt-gost-yescrypt.c",
  "./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static --enable-hashes=strong,glibc --enable-obsolete-api=no --disable-failure-tokens",
  "make"
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/share/info/dir\""
]
