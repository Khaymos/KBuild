name = "make-target"
version = "4.4.1"
source = "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz"
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"
archive_root = "make-4.4.1"

# GNU Make compiled for KhaymOS, using its own glibc sysroot.
build_type = "target"

depends = ["glibc"]

build = [
  "./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --disable-nls --without-guile",
  "make"
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/share/info/dir\""
]
