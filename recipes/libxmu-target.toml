name = "libxmu-target"
version = "1.3.1"
source = "https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.3.1.tar.xz"
sha256 = "81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4"
archive_root = "libXmu-1.3.1"
build_type = "target"
profile = "xorg"
depends = ["glibc", "libxt-target", "libxext-target", "libx11-target", "xorgproto-target", "util-macros-target"]

build = [
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" ./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static",
  "make -j\"$(nproc)\""
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/lib/libXmu.la\" \"$DESTDIR/usr/lib/libXmuu.la\""
]
