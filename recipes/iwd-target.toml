name = "iwd-target"
version = "3.12"
source = "https://www.kernel.org/pub/linux/network/wireless/iwd-3.12.tar.xz"
sha256 = "d89a5e45c7180170e19be828f9e944a768c593758094fc57a358d0e7c4cb1a49"
archive_root = "iwd-3.12"
build_type = "target"
depends = ["glibc", "linux-headers", "dbus-target", "openssl-target", "readline-target"]

build = [
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" ./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --sysconfdir=/etc --localstatedir=/var --libexecdir=/usr/libexec --with-dbus-datadir=/usr/share/dbus-1 --disable-systemd-service --disable-manual-pages",
  "make"
]

install = [
  "make DESTDIR=\"$DESTDIR\" install"
]
