name = "xf86-input-evdev-target"
version = "2.11.0"
source = "https://xorg.freedesktop.org/archive/individual/driver/xf86-input-evdev-2.11.0.tar.xz"
sha256 = "730022de934cc366bb12439daf202a7bfff52a028cf4573e457642e25a071315"
archive_root = "xf86-input-evdev-2.11.0"
build_type = "target"
profile = "xorg"
depends = ["glibc", "xorg-server-target", "libevdev-target", "mtdev-target", "xorgproto-target", "util-macros-target"]

build = [
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" ./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib",
  "make -j\"$(nproc)\""
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/lib/xorg/modules/input/evdev_drv.la\""
]
