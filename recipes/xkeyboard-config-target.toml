name = "xkeyboard-config-target"
version = "2.49"
source = "https://gitlab.freedesktop.org/xkeyboard-config/xkeyboard-config/-/archive/xkeyboard-config-2.49/xkeyboard-config-xkeyboard-config-2.49.tar.bz2"
sha256 = "dea89e6bd28e227a69a73bc950f8104ffc4257bbb86709b176973d7acc4a263d"
archive_root = "xkeyboard-config-xkeyboard-config-2.49"
build_type = "target"
profile = "xorg"
depends = ["glibc", "util-macros-target", "xorgproto-target"]

build = [
  "python3 \"$KBUILD_ROOT/scripts/write-meson-cross-file.py\" khaymos-cross.ini",
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" meson setup --cross-file khaymos-cross.ini --prefix=/usr --libdir=lib --buildtype=release --wrap-mode=nofallback -Dxorg-rules-symlinks=true -Dnls=false build",
  "ninja -C build -j\"$(nproc)\""
]

install = [
  "meson install -C build --destdir \"$DESTDIR\""
]
