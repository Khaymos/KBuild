name = "libxml2-target"
version = "2.15.4"
source = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"
archive_root = "libxml2-2.15.4"
build_type = "target"
profile = "xorg"
depends = ["glibc", "zlib-target"]

build = [
  "python3 \"$KBUILD_ROOT/scripts/write-meson-cross-file.py\" khaymos-cross.ini",
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" meson setup --cross-file khaymos-cross.ini --prefix=/usr --libdir=lib --buildtype=release --wrap-mode=nofallback -Ddocs=disabled -Dpython=disabled -Dhtml=disabled -Dhttp=disabled -Dicu=disabled -Dlegacy=disabled -Dmodules=disabled -Dreadline=disabled -Dzlib=enabled build",
  "ninja -C build -j\"$(nproc)\""
]

install = [
  "meson install -C build --destdir \"$DESTDIR\""
]
