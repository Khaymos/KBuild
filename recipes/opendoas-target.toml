name = "opendoas-target"
version = "6.8.2"
source = "https://github.com/Duncaen/OpenDoas/archive/refs/tags/v6.8.2.tar.gz"
sha256 = "6da058a0e70b7543bc60624389b0b00b686189ec933828c522bf8b2600495a67"
archive_root = "OpenDoas-6.8.2"
build_type = "target"
depends = ["glibc", "libxcrypt-target"]
build = ["./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --target=\"$KBUILD_TARGET\" --prefix=/usr --bindir=/usr/bin --sysconfdir=/etc --with-shadow", "make -j\"$(nproc)\" CC=\"$CC\" YACC=\"bison -y\""]
install = ["make DESTDIR=\"$DESTDIR\" install", "chmod 4755 \"$DESTDIR/usr/bin/doas\""]
