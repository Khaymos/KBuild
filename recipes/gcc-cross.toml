name = "gcc-cross"
version = "16.1.0"
source = "https://ftp.gnu.org/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz"
sha256 = "50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79"
archive_root = "gcc-16.1.0"

# Final full cross-GCC after target glibc has been built and deployed.
build_type = "host"

depends = ["binutils-cross", "glibc"]

build = [
  "mkdir -p ../gcc-build",
  "cd ../gcc-build && ../gcc-16.1.0/configure --prefix=\"$KBUILD_TOOLCHAIN\" --infodir=\"$KBUILD_TOOLCHAIN/share/info/gcc\" --target=\"$KBUILD_TARGET\" --with-sysroot=\"$SYSROOT\" --with-build-sysroot=\"$SYSROOT\" --with-as=\"$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-as\" --with-ld=\"$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-ld\" --with-native-system-header-dir=/usr/include --with-gmp=/usr --with-mpfr=/usr --with-mpc=/usr --with-system-zlib --disable-bootstrap --disable-multilib --disable-nls --disable-libquadmath --disable-libssp --disable-libvtv --disable-libsanitizer --enable-languages=c,c++ --enable-shared --enable-threads=posix",
  "cd ../gcc-build && make all-gcc all-target-libgcc all-target-libatomic all-target-libgomp all-target-libstdc++-v3"
]

install = [
  "cd ../gcc-build && make install-gcc install-target-libgcc install-target-libatomic install-target-libgomp install-target-libstdc++-v3"
]
