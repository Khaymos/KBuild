name = "harfbuzz-target"
version = "15.1.0"
source = "https://github.com/harfbuzz/harfbuzz/releases/download/15.1.0/harfbuzz-15.1.0.tar.xz"
sha256 = "0fc7c565443a5f4be7da65ac5ee5bd737d9b158dc908708b7689a0a5796b0c8d"
archive_root = "harfbuzz-15.1.0"
build_type = "target"
profile = "xorg"
depends = ["glibc", "freetype-target", "glib-target"]

build = [
  "python3 \"$KBUILD_ROOT/scripts/write-meson-cross-file.py\" khaymos-cross.ini",
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" meson setup --cross-file khaymos-cross.ini --prefix=/usr --libdir=lib --buildtype=release --wrap-mode=nofallback -Dglib=enabled -Dgobject=enabled -Dfreetype=enabled -Dcairo=disabled -Dchafa=disabled -Dpng=disabled -Dzlib=disabled -Dicu=disabled -Dgraphite2=disabled -Dsubset=disabled -Draster=disabled -Dvector=disabled -Dgpu=disabled -Dtests=disabled -Dintrospection=disabled -Ddocs=disabled -Dutilities=disabled build",
  "ninja -C build -j\"$(nproc)\""
]

install = [
  "meson install -C build --destdir \"$DESTDIR\""
]
