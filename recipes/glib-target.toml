name = "glib-target"
version = "2.90.1"
source = "https://download.gnome.org/sources/glib/2.90/glib-2.90.1.tar.xz"
sha256 = "93c941aa17d5eb1d53fe838365f29a8b4e539c222a256d974ec8f30fc413e396"
archive_root = "glib-2.90.1"
build_type = "target"
depends = [
  "glibc",
  "libffi-target",
  "pcre2-target",
  "zlib-target",
  "util-linux-target"
]

build = [
  """cat > khaymos-cross.ini <<EOF
[binaries]
c = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-gcc'
ar = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-ar'
strip = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-strip'
pkgconfig = '/usr/bin/pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '$SYSROOT'
pkg_config_libdir = ['$SYSROOT/usr/lib/pkgconfig', '$SYSROOT/usr/share/pkgconfig']
needs_exe_wrapper = true
EOF""",
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" meson setup --cross-file khaymos-cross.ini --prefix=/usr --bindir=bin --sbindir=sbin --libdir=lib --libexecdir=lib --includedir=include --datadir=share --localedir=share/locale --sysconfdir=/etc --localstatedir=/var --buildtype=release --wrap-mode=nofallback -Dnls=enabled -Dtests=false -Dinstalled_tests=false -Dintrospection=disabled -Dselinux=disabled -Dlibmount=enabled -Dman-pages=disabled -Ddtrace=disabled -Dsystemtap=disabled -Dsysprof=disabled -Dlibelf=disabled build",
  "ninja -C build"
]

install = [
  "meson install -C build --destdir \"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/share/info/dir\""
]
