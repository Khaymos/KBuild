name = "libevdev-target"
version = "1.14.0"
source = "https://www.freedesktop.org/software/libevdev/libevdev-1.14.0.tar.xz"
sha256 = "5a0966c7110648665983848bad696c7acba614a2160d2865d535397101007332"
archive_root = "libevdev-1.14.0"
build_type = "target"
profile = "xorg"
depends = ["glibc"]

build = [
  "python3 \"$KBUILD_ROOT/scripts/write-meson-cross-file.py\" khaymos-cross.ini",
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" meson setup --cross-file khaymos-cross.ini --prefix=/usr --libdir=lib --buildtype=release --wrap-mode=nofallback -Dtests=false -Ddocumentation=false build",
  "ninja -C build -j\"$(nproc)\""
]

install = [
  "meson install -C build --destdir \"$DESTDIR\""
]
