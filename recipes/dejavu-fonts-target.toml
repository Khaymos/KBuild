name = "dejavu-fonts-target"
version = "2.37"
source = "https://downloads.sourceforge.net/project/dejavu/dejavu/2.37/dejavu-fonts-ttf-2.37.tar.bz2"
sha256 = "fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7"
archive_root = "dejavu-fonts-ttf-2.37"
build_type = "target"
profile = "xorg"
depends = ["glibc", "fontconfig-target"]

# Install the official prebuilt TrueType family; no font-generation tools
# are needed. Fontconfig scans /usr/share/fonts recursively.
build = []

install = [
  "install -d \"$DESTDIR/usr/share/fonts/truetype/dejavu\" \"$DESTDIR/usr/share/licenses/dejavu-fonts\"",
  "install -m644 ttf/*.ttf \"$DESTDIR/usr/share/fonts/truetype/dejavu/\"",
  "install -m644 LICENSE \"$DESTDIR/usr/share/licenses/dejavu-fonts/LICENSE\""
]
