name = "fribidi-target"
version = "1.0.18"
source = "https://github.com/fribidi/fribidi/releases/download/v1.0.18/fribidi-1.0.18.tar.xz"
sha256 = "1de5e8073d035388b71d0b2d452b1da1f8caeea8a7702997b401fe1b6250727f"
archive_root = "fribidi-1.0.18"
build_type = "target"
profile = "xorg"
depends = ["glibc"]

build = [
  "python3 \"$KBUILD_ROOT/scripts/write-meson-cross-file.py\" khaymos-cross.ini",
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" meson setup --cross-file khaymos-cross.ini --prefix=/usr --libdir=lib --buildtype=release --wrap-mode=nofallback -Ddocs=false -Dbin=false -Dtests=false build",
  "ninja -C build -j\"$(nproc)\""
]

install = [
  "meson install -C build --destdir \"$DESTDIR\""
]
