name = "gcc-cross-stage1"
version = "16.1.0"
source = "https://ftp.gnu.org/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz"
sha256 = "50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79"
archive_root = "gcc-16.1.0"

# Header-only stage-1 cross-GCC used to build the target C library.
# It is deliberately built without target libc and is isolated from the
# final cross-compiler under toolchain/bootstrap/.
build_type = "host"

depends = ["binutils-cross", "linux-headers"]

build = [
  "mkdir -p ../gcc-stage1-build",
  "cd ../gcc-stage1-build && ../gcc-16.1.0/configure --prefix=\"$KBUILD_TOOLCHAIN/bootstrap\" --infodir=\"$KBUILD_TOOLCHAIN/bootstrap/share/info/gcc\" --target=\"$KBUILD_TARGET\" --with-sysroot=\"$SYSROOT\" --with-as=\"$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-as\" --with-ld=\"$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-ld\" --with-gmp=/usr --with-mpfr=/usr --with-mpc=/usr --with-system-zlib --without-headers --with-newlib --disable-bootstrap --disable-multilib --disable-nls --disable-shared --disable-threads --disable-libatomic --disable-libgomp --disable-libquadmath --disable-libssp --disable-libvtv --disable-libsanitizer --enable-languages=c",
  "cd ../gcc-stage1-build && make all-gcc"
]

install = [
  "cd ../gcc-stage1-build && make install-gcc"
]
