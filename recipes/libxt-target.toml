name = "libxt-target"
version = "1.3.1"
source = "https://xorg.freedesktop.org/archive/individual/lib/libXt-1.3.1.tar.xz"
sha256 = "e0a774b33324f4d4c05b199ea45050f87206586d81655f8bef4dba434d931288"
archive_root = "libXt-1.3.1"
build_type = "target"
profile = "xorg"
depends = ["glibc", "libsm-target", "libice-target", "libx11-target", "libxext-target", "xorgproto-target", "xtrans-target", "util-macros-target"]

build = [
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" ./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static",
  "make -j\"$(nproc)\""
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/lib/libXt.la\""
]
