name = "libxcb-target"
version = "1.17.0"
source = "https://xorg.freedesktop.org/archive/individual/lib/libxcb-1.17.0.tar.xz"
sha256 = "599ebf9996710fea71622e6e184f3a8ad5b43d0e5fa8c4e407123c88a59a6d55"
archive_root = "libxcb-1.17.0"
build_type = "target"
profile = "xorg"
depends = ["glibc", "libxau-target", "libxdmcp-target", "xcb-proto-target", "util-macros-target"]

build = [
  "PYTHONPATH=\"$SYSROOT/usr/lib/python$(python3 -c 'import sys; print(\"%d.%d\" % sys.version_info[:2])')/site-packages\" ./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static --disable-devel-docs",
  "make -j\"$(nproc)\""
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/lib/libxcb.la\""
]
