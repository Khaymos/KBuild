name = "libxft-target"
version = "2.3.9"
source = "https://xorg.freedesktop.org/archive/individual/lib/libXft-2.3.9.tar.xz"
sha256 = "60a25b78945ed6932635b3bb1899a517d31df7456e69867ffba27f89ff3976f5"
archive_root = "libXft-2.3.9"
build_type = "target"
profile = "xorg"
depends = ["glibc", "freetype-target", "fontconfig-target", "libxrender-target", "libx11-target", "xorgproto-target", "util-macros-target"]

build = [
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" ./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static",
  "make -j\"$(nproc)\""
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/lib/libXft.la\""
]
