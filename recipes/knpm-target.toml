name = "knpm-target"
version = "0.1.0"
source = "https://github.com/Khaymos/knpm/archive/275d9e42bcad6728c70eec31cb8206aac3f240f4.tar.gz"
sha256 = "a3f7fd456e81fc51a7d1279ec2918d6ec0b26e6ed7ce7a2691b85b87fbe7939b"
build_type = "target"
depends = ["glibc", "gcc-runtime", "curl-target", "ca-certificates-target"]

build = [
  "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=\"$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-gcc\" cargo build --release --locked --offline --target x86_64-unknown-linux-gnu",
]

install = [
  "install -Dm755 target/x86_64-unknown-linux-gnu/release/knpm \"$DESTDIR/usr/bin/knpm\"",
]
