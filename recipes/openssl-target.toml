name = "openssl-target"
version = "3.5.9"
source = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz"
sha256 = "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
archive_root = "openssl-3.5.9"
build_type = "target"
depends = ["glibc", "zlib-target"]

build = [
  "./Configure linux-x86_64 --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic no-tests",
  "make"
]

install = [
  "make DESTDIR=\"$DESTDIR\" install_sw install_ssldirs"
]
