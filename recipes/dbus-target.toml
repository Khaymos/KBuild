name = "dbus-target"
version = "1.16.2"
source = "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz"
sha256 = "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2"
archive_root = "dbus-1.16.2"
build_type = "target"
depends = ["glibc", "expat-target"]

build = [
  """cat > khaymos-cross.ini <<EOF
[binaries]
c = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-gcc'
ar = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-ar'
strip = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-strip'
pkgconfig = '/usr/bin/pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '$SYSROOT'
pkg_config_libdir = ['$SYSROOT/usr/lib/pkgconfig', '$SYSROOT/usr/share/pkgconfig']
needs_exe_wrapper = true
EOF""",
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" meson setup --cross-file khaymos-cross.ini --prefix=/usr --bindir=bin --sbindir=sbin --libdir=lib --libexecdir=libexec --includedir=include --datadir=share --sysconfdir=/etc --localstatedir=/var --buildtype=release --wrap-mode=nofallback -Dsystemd=disabled -Duser_session=false -Dselinux=disabled -Dapparmor=disabled -Dlibaudit=disabled -Dx11_autolaunch=disabled -Ddoxygen_docs=disabled -Dducktype_docs=disabled -Dxml_docs=disabled -Dqt_help=disabled -Dmodular_tests=disabled -Dinstalled_tests=false -Dtools=true -Dmessage_bus=true -Depoll=enabled -Dinotify=enabled -Druntime_dir=/run -Dsystem_socket=/run/dbus/system_bus_socket -Dsystem_pid_file=/run/dbus/pid -Ddbus_user=messagebus build",
  "ninja -C build"
]

install = [
  "meson install -C build --destdir \"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/share/info/dir\""
]
