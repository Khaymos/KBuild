name = "font-util-target"
version = "1.4.2"
source = "https://xorg.freedesktop.org/archive/individual/font/font-util-1.4.2.tar.xz"
sha256 = "02e4f8afdcf03cc8372ca9c37aa104b1e36b47722dbc79531be08f0a4c622999"
archive_root = "font-util-1.4.2"
build_type = "target"
profile = "xorg"
depends = ["glibc", "util-macros-target"]

build = [
  "./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr",
