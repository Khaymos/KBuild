name = "popt-target"
version = "1.19"
source = "https://ftp.rpm.org/popt/releases/popt-1.x/popt-1.19.tar.gz"
sha256 = "c25a4838fc8e4c1c8aacb8bd620edb3084a3d63bf8987fdad3ca2758c63240f9"
archive_root = "popt-1.19"
build_type = "target"
depends = ["glibc"]
build = ["./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --disable-static --enable-shared", "make -j\"$(nproc)\""]
install = ["make install DESTDIR=\"$DESTDIR\"", "rm -f \"$DESTDIR/usr/share/info/dir\""]
