name = "duktape-target"
version = "2.7.0"
source = "https://duktape.org/duktape-2.7.0.tar.xz"
sha256 = "90f8d2fa8b5567c6899830ddef2c03f3c27960b11aca222fa17aa7ac613c2890"
archive_root = "duktape-2.7.0"
build_type = "target"
depends = ["glibc"]

build = [
  "sed -i 's/-Os/-O2/' Makefile.sharedlibrary",
  "make -f Makefile.sharedlibrary"
]

install = [
  "make -f Makefile.sharedlibrary INSTALL_PREFIX=/usr LIBDIR=/lib DESTDIR=\"$DESTDIR\" install",
  "rm -f \"$DESTDIR/usr/share/info/dir\""
]
