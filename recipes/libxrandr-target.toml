name = "libxrandr-target"
version = "1.5.5"
source = "https://xorg.freedesktop.org/archive/individual/lib/libXrandr-1.5.5.tar.xz"
sha256 = "72b922c2e765434e9e9f0960148070bd4504b288263e2868a4ccce1b7cf2767a"
archive_root = "libXrandr-1.5.5"
build_type = "target"
profile = "xorg"
depends = ["glibc", "libx11-target", "libxext-target", "libxrender-target", "xorgproto-target", "util-macros-target"]

build = [
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" ./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static",
  "make -j\"$(nproc)\""
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/lib/libXrandr.la\""
]
