name = "coreutils-target"
version = "9.12"
source = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.12.tar.xz"
sha256 = "a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210"
archive_root = "coreutils-9.12"

build_type = "target"
depends = ["glibc"]

build = [
  "./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --disable-nls",
  "make"
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/share/info/dir\""
]
