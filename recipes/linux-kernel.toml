name = "linux-kernel"
version = "7.2.10"
source = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.10.tar.xz"
sha256 = "2feaa70453e91f541be6a5c9078d8168e081af45a3d9718054850538cff2ebf3"
archive_root = "linux-7.2.10"
build_type = "target"
depends = []

build = [
  "for tool in make gcc bc bison flex perl; do command -v \"$tool\" >/dev/null 2>&1 || { echo \"Missing host build tool: $tool\"; exit 1; }; done; CROSS_GCC=\"$KBUILD_TOOLCHAIN/bin/${KBUILD_TARGET}-gcc\"; test -x \"$CROSS_GCC\" || { echo \"Missing KhaymOS cross-compiler: $CROSS_GCC\"; exit 1; }; \"$CROSS_GCC\" --version | head -n 1",
  "env -u CC -u CFLAGS -u CPPFLAGS -u CXXFLAGS -u LDFLAGS -u PKG_CONFIG_SYSROOT_DIR -u PKG_CONFIG_LIBDIR make ARCH=x86 x86_64_defconfig",
  "./scripts/config --file .config --enable MODULES --enable BLK_DEV_INITRD --enable RD_GZIP --enable DEVTMPFS --enable DEVTMPFS_MOUNT --enable PROC_FS --enable SYSFS --enable TMPFS --enable BINFMT_ELF --enable BINFMT_SCRIPT --enable TTY --enable SERIAL_8250 --enable SERIAL_8250_CONSOLE --enable UNIX98_PTYS --enable DEVPTS_FS --enable BLK_DEV_NVME --enable BLK_DEV_LOOP --enable OVERLAY_FS --enable SQUASHFS --enable SQUASHFS_XZ --enable ISO9660_FS --enable SCSI --enable BLK_DEV_SD --enable BLK_DEV_SR --enable USB --enable USB_PCI --enable USB_STORAGE --enable USB_UAS --enable USB_XHCI_HCD --enable USB_XHCI_PCI --enable USB_EHCI_HCD --enable USB_EHCI_PCI --enable USB_OHCI_HCD --enable USB_OHCI_HCD_PCI --enable USB_UHCI_HCD --enable HID --enable HID_GENERIC --enable USB_HID --enable ATA --enable SATA_AHCI --enable ATA_PIIX --enable MMC --enable MMC_BLOCK --enable MMC_SDHCI --enable MMC_SDHCI_PCI --enable VIRTIO_PCI --enable VIRTIO_BLK --enable WLAN --enable WLAN_VENDOR_ATH --enable WLAN_VENDOR_BROADCOM --enable WLAN_VENDOR_INTEL --enable WLAN_VENDOR_MEDIATEK --enable WLAN_VENDOR_REALTEK --enable KEYS --enable CRYPTO_USER_API_HASH --enable CRYPTO_USER_API_SKCIPHER --enable CRYPTO_MD5 --enable CRYPTO_SHA1 --enable CRYPTO_SHA256 --enable CRYPTO_SHA512 --enable CRYPTO_AES --enable CRYPTO_DES --enable CRYPTO_ECB --enable CRYPTO_CBC --enable CRYPTO_CMAC --enable CRYPTO_HMAC --enable KEY_DH_OPERATIONS --module CFG80211 --module MAC80211 --module MAC80211_HWSIM --enable RFKILL --enable FW_LOADER --enable FW_LOADER_COMPRESS --enable FW_LOADER_COMPRESS_XZ --enable FW_LOADER_COMPRESS_ZSTD --module IWLWIFI --module IWLMVM --module ATH9K --module ATH10K_PCI --module ATH11K_PCI --module BRCMFMAC --module RTL8XXXU --module RTW88_8822BE --module RTW89_8852AE --module RTW89_8852BE --module RTW89_8852CE --module MT7921E --module MT7925E --module USB_USBNET --module USB_NET_RNDIS_HOST --module USB_NET_CDCETHER --module USB_NET_CDC_NCM",
  "env -u CC -u CFLAGS -u CPPFLAGS -u CXXFLAGS -u LDFLAGS -u PKG_CONFIG_SYSROOT_DIR -u PKG_CONFIG_LIBDIR make ARCH=x86 olddefconfig",
  "for option in RFKILL CRYPTO_USER_API_HASH CRYPTO_USER_API_SKCIPHER CRYPTO_MD5 CRYPTO_SHA1 CRYPTO_SHA256 CRYPTO_SHA512 CRYPTO_AES CRYPTO_DES CRYPTO_ECB CRYPTO_CBC CRYPTO_CMAC CRYPTO_HMAC KEY_DH_OPERATIONS; do grep -qx \"CONFIG_${option}=y\" .config || { echo \"Required iwd crypto option is not built-in: CONFIG_${option}\" >&2; exit 1; }; done",
  "for option in BLK_DEV_LOOP OVERLAY_FS SQUASHFS SQUASHFS_XZ ISO9660_FS SCSI BLK_DEV_SD BLK_DEV_SR USB USB_PCI USB_STORAGE USB_UAS USB_XHCI_HCD USB_XHCI_PCI USB_EHCI_HCD USB_EHCI_PCI USB_OHCI_HCD USB_OHCI_HCD_PCI USB_UHCI_HCD HID HID_GENERIC USB_HID ATA SATA_AHCI ATA_PIIX MMC MMC_BLOCK MMC_SDHCI MMC_SDHCI_PCI VIRTIO_PCI VIRTIO_BLK; do grep -qx \"CONFIG_${option}=y\" .config || { echo \"Required KhaymOS live-boot option is not built-in: CONFIG_${option}\" >&2; exit 1; }; done",
  "grep -qx 'CONFIG_MAC80211_HWSIM=m' .config || { echo 'Required virtual Wi-Fi test module is not built as a module: CONFIG_MAC80211_HWSIM' >&2; exit 1; }",
  "PATH=\"$KBUILD_TOOLCHAIN/bin:$PATH\" env -u CC -u CFLAGS -u CPPFLAGS -u CXXFLAGS -u LDFLAGS -u PKG_CONFIG_SYSROOT_DIR -u PKG_CONFIG_LIBDIR make ARCH=x86 CROSS_COMPILE=\"${KBUILD_TARGET}-\" bzImage modules"
]

install = [
  "install -Dm644 arch/x86/boot/bzImage \"$DESTDIR/boot/vmlinuz-khaymos-7.2.10\"",
  "install -Dm644 .config \"$DESTDIR/boot/config-7.2.10\"",
  "install -Dm644 System.map \"$DESTDIR/boot/System.map-7.2.10\"",
  "PATH=\"$KBUILD_TOOLCHAIN/bin:$PATH\" make ARCH=x86 CROSS_COMPILE=\"${KBUILD_TARGET}-\" INSTALL_MOD_PATH=\"$DESTDIR\" modules_install"
]
