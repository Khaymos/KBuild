name = "linux-kernel"
version = "7.2.10"
source = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.10.tar.xz"
sha256 = "2feaa70453e91f541be6a5c9078d8168e081af45a3d9718054850538cff2ebf3"
archive_root = "linux-7.2.10"
build_type = "target"
depends = []

build = [
  "for tool in make gcc bc bison flex perl; do command -v \"$tool\" >/dev/null 2>&1 || { echo \"Missing host build tool: $tool\"; exit 1; }; done; CROSS_GCC=\"$KBUILD_TOOLCHAIN/bin/${KBUILD_TARGET}-gcc\"; test -x \"$CROSS_GCC\" || { echo \"Missing KhaymOS cross-compiler: $CROSS_GCC\"; exit 1; }; \"$CROSS_GCC\" --version | head -n 1",
  "env -u CC -u CFLAGS -u CPPFLAGS -u CXXFLAGS -u LDFLAGS -u PKG_CONFIG_SYSROOT_DIR -u PKG_CONFIG_LIBDIR make ARCH=x86 x86_64_defconfig",
  "./scripts/config --file .config --enable MODULES --enable BLK_DEV_INITRD --enable RD_GZIP --enable DEVTMPFS --enable DEVTMPFS_MOUNT --enable PROC_FS --enable SYSFS --enable TMPFS --enable BINFMT_ELF --enable BINFMT_SCRIPT --enable TTY --enable SERIAL_8250 --enable SERIAL_8250_CONSOLE --enable UNIX98_PTYS --enable DEVPTS_FS --enable BLK_DEV_NVME --enable WLAN --enable WLAN_VENDOR_ATH --enable WLAN_VENDOR_BROADCOM --enable WLAN_VENDOR_INTEL --enable WLAN_VENDOR_MEDIATEK --enable WLAN_VENDOR_REALTEK --module CFG80211 --module MAC80211 --module RFKILL --enable FW_LOADER --enable FW_LOADER_COMPRESS --enable FW_LOADER_COMPRESS_XZ --enable FW_LOADER_COMPRESS_ZSTD --module IWLWIFI --module IWLMVM --module ATH9K --module ATH10K_PCI --module ATH11K_PCI --module BRCMFMAC --module RTL8XXXU --module RTW88_8822BE --module RTW89_8852AE --module RTW89_8852BE --module RTW89_8852CE --module MT7921E --module MT7925E --module USB_USBNET --module USB_NET_RNDIS_HOST --module USB_NET_CDCETHER --module USB_NET_CDC_NCM",
  "env -u CC -u CFLAGS -u CPPFLAGS -u CXXFLAGS -u LDFLAGS -u PKG_CONFIG_SYSROOT_DIR -u PKG_CONFIG_LIBDIR make ARCH=x86 olddefconfig",
  "PATH=\"$KBUILD_TOOLCHAIN/bin:$PATH\" env -u CC -u CFLAGS -u CPPFLAGS -u CXXFLAGS -u LDFLAGS -u PKG_CONFIG_SYSROOT_DIR -u PKG_CONFIG_LIBDIR make -j\"$(nproc)\" ARCH=x86 CROSS_COMPILE=\"${KBUILD_TARGET}-\" bzImage modules"
]

install = [
  "install -Dm644 arch/x86/boot/bzImage \"$DESTDIR/boot/vmlinuz-khaymos-7.2.10\"",
  "install -Dm644 .config \"$DESTDIR/boot/config-7.2.10\"",
  "install -Dm644 System.map \"$DESTDIR/boot/System.map-7.2.10\"",
  "PATH=\"$KBUILD_TOOLCHAIN/bin:$PATH\" make ARCH=x86 CROSS_COMPILE=\"${KBUILD_TARGET}-\" INSTALL_MOD_PATH=\"$DESTDIR\" modules_install"
]
