name = "freetype-target"
version = "2.15.0"
source = "https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz"
sha256 = "93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5"
archive_root = "freetype-2.15.0"
build_type = "target"
profile = "xorg"
depends = ["glibc", "zlib-target"]

build = [
  "./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static --with-zlib=yes --with-bzip2=no --with-png=no --with-harfbuzz=no --with-brotli=no",
  "make -j\"$(nproc)\""
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/lib/libfreetype.la\""
]
