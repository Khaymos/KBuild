name = "libunistring-target"
version = "1.4.2"
source = "https://ftp.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.xz"
sha256 = "5b46e74377ed7409c5b75e7a96f95377b095623b689d8522620927964a41499c"
archive_root = "libunistring-1.4.2"
build_type = "target"
depends = ["glibc"]

build = [
  "./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static",
  "make"
]

install = [
  "make install DESTDIR=\"$DESTDIR\"",
  "rm -f \"$DESTDIR/usr/share/info/dir\""
]
