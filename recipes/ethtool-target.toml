name = "ethtool-target"
version = "7.2"
source = "https://www.kernel.org/pub/software/network/ethtool/ethtool-7.2.tar.xz"
sha256 = "44256ddf4631ed08d816b7b8725f4b2e0f05e96b8c7ca64ee5c81449da2b6507"
archive_root = "ethtool-7.2"
build_type = "target"
depends = ["glibc"]
build = ["./configure --build=\"$(gcc -dumpmachine)\" --host=\"$KBUILD_TARGET\" --prefix=/usr --bindir=/usr/bin --sbindir=/usr/sbin --disable-netlink", "make -j\"$(nproc)\""]
install = ["make install DESTDIR=\"$DESTDIR\"", "rm -f \"$DESTDIR/usr/share/info/dir\""]
