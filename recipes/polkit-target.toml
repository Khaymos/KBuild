name = "polkit-target"
version = "127"
source = "https://github.com/polkit-org/polkit/archive/127/polkit-127.tar.gz"
sha256 = "9b7bc16f086479dcc626c575976568ba4a85d34297a750d8ab3d2e57f6d8b988"
archive_root = "polkit-127"
build_type = "target"
depends = [
  "glibc",
  "glib-target",
  "duktape-target",
  "expat-target",
  "dbus-target",
  "linux-pam-target",
  "elogind-target"
]

build = [
  """cat > khaymos-cross.ini <<EOF
[binaries]
c = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-gcc'
ar = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-ar'
strip = '$KBUILD_TOOLCHAIN/bin/$KBUILD_TARGET-strip'
pkg-config = '/usr/bin/pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '$SYSROOT'
pkg_config_libdir = ['$SYSROOT/usr/lib/pkgconfig', '$SYSROOT/usr/share/pkgconfig']
needs_exe_wrapper = true
EOF""",
  """python3 - <<'PY'
from pathlib import Path

path = Path("meson.build")
lines = path.read_text().splitlines()

matches = [
    i for i, line in enumerate(lines)
    if line.strip().startswith(
        "dbus_system_bus_services_dir = dbus_dep.get_variable"
    )
]

if len(matches) != 1:
    raise SystemExit(
        "Expected exactly one Polkit D-Bus service directory expression; "
        f"found {len(matches)}"
    )

i = matches[0]
indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
lines[i] = (
    indent
    + "dbus_system_bus_services_dir = "
    + "pk_prefix / pk_datadir / 'dbus-1' / 'system-services'"
)

path.write_text(chr(10).join(lines) + chr(10))
PY""",
  "PKG_CONFIG_SYSROOT_DIR=\"$SYSROOT\" PKG_CONFIG_LIBDIR=\"$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig\" meson setup --cross-file khaymos-cross.ini --prefix=/usr --bindir=bin --sbindir=sbin --libdir=lib --libexecdir=libexec --includedir=include --datadir=share --sysconfdir=/etc --localstatedir=/var --buildtype=release --wrap-mode=nofallback -Dos_type=lfs -Dprivileged_group=wheel -Dpolkitd_user=polkitd -Dsession_tracking=elogind -Dauthfw=pam -Dpam_include=system-auth -Dpam_prefix=/etc/pam.d -Dsystemdsystemunitdir=/tmp -Dintrospection=false -Dgtk_doc=false -Dman=false -Dtests=false -Dgettext=true build",
  "ninja -C build"
]

install = [
  "meson install -C build --destdir \"$DESTDIR\"",
  "chmod 4755 \"$DESTDIR/usr/bin/pkexec\"",
  "chmod 4755 \"$DESTDIR/usr/lib/polkit-1/polkit-agent-helper-1\"",
  "rm -f \"$DESTDIR\"/tmp/*.service",
  "rmdir \"$DESTDIR/tmp\" 2>/dev/null || true",
  "rm -rf \"$DESTDIR/usr/lib/sysusers.d\" \"$DESTDIR/usr/lib/tmpfiles.d\"",
  "rm -f \"$DESTDIR/usr/share/info/dir\""
]
