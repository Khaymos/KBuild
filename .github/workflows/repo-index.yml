name: KBuild repository-index tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repo-index:
    name: Test repository index generation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check shell script syntax
        run: |
          bash -n scripts/assemble-rootfs.sh
          bash -n scripts/publish-repo.sh

      - name: Run repository and recipe tests
        run: python -m unittest discover -s tests -v

      - name: Verify pinned network-related package sources
        run: |
          python3 kbuild.py verify openssl-target
          python3 kbuild.py verify ca-certificates-target
          python3 kbuild.py verify libunistring-target
          python3 kbuild.py verify libidn2-target
          python3 kbuild.py verify libpsl-target
          python3 kbuild.py verify curl-target
          python3 kbuild.py verify wget-target
          python3 kbuild.py verify dhcpcd-target
          python3 kbuild.py verify iproute2-target
          python3 kbuild.py verify knpm-target

