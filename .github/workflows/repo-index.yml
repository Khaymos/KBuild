name: KBuild repository-index tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repo-index:
    name: Test repository index generation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check publishing script syntax
        run: bash -n scripts/publish-repo.sh

      - name: Run repository index tests
        run: python -m unittest discover -s tests -p 'test_repo_index.py'
